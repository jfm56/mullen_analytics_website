version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mullen_postgres
    environment:
      POSTGRES_USER: mullen
      POSTGRES_PASSWORD: mullen_dev_password
      POSTGRES_DB: mullen_analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mullen -d mullen_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
