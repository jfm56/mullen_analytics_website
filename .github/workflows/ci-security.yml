name: ci-security

# Security + test gate. Runs on every push and PR (i.e., every build before deploy).
# Mirrors the scans run during the AWS staging work: pip-audit + bandit + pytest.
# A failed step fails the job (red X), which blocks the PR when the check is required.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mullen_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mullen_analytics
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATA_STORAGE_ROOT: /tmp/clientdata
      DATA_UPLOADS_ROOT: /tmp/datauploads
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit pytest

      - name: Dependency vulnerability scan (pip-audit)
        # --strict: fail on ANY vulnerability or un-auditable dependency.
        # The --ignore-vuln entries below are the ONLY accepted residuals; each is
        # either no-fix-available or a dev/test-only or framework-blocked advisory,
        # documented in docs/dependency-remediation.md. Everything with a safe fix
        # has been upgraded; three unused CVE-bearing packages were removed.
        run: |
          pip-audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249
          # Residuals (reviewed 2026-10-07):
          #   PYSEC-2025-183  pyjwt 2.15.1  — no upstream fix available (pinned to latest)
          #   PYSEC-2026-1845 pytest 7.4.4  — dev/test-only, not in runtime; fix needs pytest-asyncio major
          #   PYSEC-2026-1942/161/2280/2281/248/249  starlette 0.48.0 — fixed only in starlette
          #     0.49.1 / 1.x, which requires a FastAPI 0.119+ + pydantic 2.9+ upgrade (a pydantic
          #     cascade deliberately deferred to a separate, reviewed prod change). Low-severity
          #     DoS class; trial is synthetic/no-PHI and staging sits behind CloudFront/ALB.

      - name: SAST (bandit, fail on Medium+)
        run: bandit -r app/ -ll

      - name: Tests
        run: |
          pytest tests/ -q
          pytest scripts/audit/test_role_boundary_review.py -q
