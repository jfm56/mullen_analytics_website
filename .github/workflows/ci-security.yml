name: ci-security

# Security + test gate. Runs on every push and PR (i.e., every build before deploy).
# Mirrors the scans run during the AWS staging work: pip-audit + bandit + pytest.
# A failed step fails the job (red X), which blocks the PR when the check is required.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mullen_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mullen_analytics
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATA_STORAGE_ROOT: /tmp/clientdata
      DATA_UPLOADS_ROOT: /tmp/datauploads
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit pytest

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --strict

      - name: SAST (bandit, fail on Medium+)
        run: bandit -r app/ -ll

      - name: Tests
        run: pytest tests/ -q
