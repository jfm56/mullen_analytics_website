name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_mullen_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_mullen_analytics
      DATA_STORAGE_ROOT: /tmp/mullen_test_storage
      DATA_UPLOADS_ROOT: /tmp/mullen_test_uploads
      SESSION_COOKIE_SECURE: "false"
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        working-directory: .

      - name: Run migrations
        run: |
          for f in backend/migrations/*.sql; do
            echo "Running $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d test_mullen_analytics -f "$f" \
              || echo "  WARNING: $f had errors (non-fatal — SQLAlchemy create_all handles missing tables)"
          done

      - name: Smoke-test app imports
        run: |
          python -c "
          import sys, os
          os.environ.setdefault('DATABASE_URL', 'postgresql://postgres:postgres@localhost:5432/test_mullen_analytics')
          os.environ.setdefault('SESSION_COOKIE_SECURE', 'false')
          os.environ.setdefault('SECRET_KEY', 'ci-smoke-test-key')
          sys.path.insert(0, 'backend')
          from app.main import app
          print('App import OK')
          "

      - name: Pylint
        run: pylint backend/app --rcfile=backend/.pylintrc
        continue-on-error: false

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=40 -v --tb=long
        working-directory: backend

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: ESLint
        run: npx eslint src/ --max-warnings=200
